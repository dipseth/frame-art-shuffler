<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame Art Search</title>
  <style>
    :root {
      --bg:         #111827;
      --surface:    #1f2937;
      --surface2:   #293548;
      --border:     #374151;
      --accent:     #6366f1;
      --accent-dim: rgba(99,102,241,0.15);
      --text:       #f9fafb;
      --text-dim:   #9ca3af;
      --green:      #10b981;
      --amber:      #f59e0b;
      --red:        #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    /* ── Search bar ──────────────────────────────────────────── */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-wrap {
      flex: 1;
      min-width: 180px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-dim);
      pointer-events: none;
    }
    #q {
      width: 100%;
      padding: 10px 12px 10px 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #q:focus { border-color: var(--accent); }
    #q::placeholder { color: var(--text-dim); }

    #tv-selector {
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      max-width: 180px;
    }
    #tv-selector:focus { border-color: var(--accent); }

    .search-btn {
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .search-btn:hover { opacity: 0.88; }
    .search-btn:active { opacity: 0.75; }

    /* ── Status line ─────────────────────────────────────────── */
    #status {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
      min-height: 18px;
    }
    #status.error { color: var(--red); }

    /* ── Results grid ────────────────────────────────────────── */
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, transform 0.1s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background: var(--surface2);
      overflow: hidden;
    }
    .card-img-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: opacity 0.2s;
    }
    .card-img-wrap img.loading { opacity: 0; }
    .card-img-wrap img.loaded  { opacity: 1; }

    /* score badge overlaid on image */
    .score-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }
    .score-high { background: rgba(16,185,129,0.85); color: #fff; }
    .score-mid  { background: rgba(245,158,11,0.85);  color: #fff; }
    .score-low  { background: rgba(107,114,128,0.75); color: #fff; }

    .card-body {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .card-name {
      font-size: 11px;
      color: var(--text-dim);
      word-break: break-all;
      line-height: 1.35;
    }
    .card-name strong {
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }
    .card-tags {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
      flex: 1;
    }
    .card-footer {
      margin-top: 6px;
      display: flex;
      gap: 6px;
    }
    .display-btn {
      flex: 1;
      padding: 6px 0;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .display-btn:hover   { opacity: 0.88; }
    .display-btn:active  { opacity: 0.7; }
    .display-btn.sending { opacity: 0.5; cursor: wait; }
    .display-btn.sent    { background: var(--green); }

    /* ── Empty / loading states ──────────────────────────────── */
    .placeholder {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 0;
      color: var(--text-dim);
      font-size: 14px;
    }
    .placeholder svg {
      width: 48px; height: 48px;
      opacity: 0.3;
      margin-bottom: 12px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      max-width: 300px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    #toast.success { border-color: var(--green); }
    #toast.error   { border-color: var(--red); }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="search-wrap">
      <!-- search icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Search artwork… pink flowers, winter landscape, abstract">
    </div>

    <select id="tv-selector">
      <option value="">Loading TVs…</option>
    </select>

    <button class="search-btn" onclick="doSearch()">Search</button>
  </div>

  <div id="status"></div>

  <div id="results">
    <div class="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
      Type a description and press Search to find artwork
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API = '/api/frame_art_shuffler';

    // ── Helpers ──────────────────────────────────────────────────

    function setStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = isError ? 'error' : '';
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show ' + (type || '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = ''; }, 3000);
    }

    function scoreClass(s) {
      if (s >= 0.30) return 'score-high';
      if (s >= 0.18) return 'score-mid';
      return 'score-low';
    }

    function stemName(filename) {
      return (filename || '').replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
    }

    // ── TV selector ──────────────────────────────────────────────

    async function loadTVs() {
      try {
        const r = await fetch(`${API}/search_config`);
        const data = await r.json();
        const sel = document.getElementById('tv-selector');
        if (data.tvs && data.tvs.length > 0) {
          sel.innerHTML = data.tvs
            .map(tv => `<option value="${escHtml(tv.tv_id)}">${escHtml(tv.name)}</option>`)
            .join('');
        } else {
          sel.innerHTML = '<option value="">No TVs found</option>';
        }
      } catch (e) {
        document.getElementById('tv-selector').innerHTML =
          '<option value="">Error loading TVs</option>';
      }
    }

    // ── Search ───────────────────────────────────────────────────

    async function doSearch() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;

      setStatus('Searching…');
      document.getElementById('results').innerHTML = '';

      try {
        const r = await fetch(`${API}/search?q=${encodeURIComponent(q)}&top_k=16`);
        const data = await r.json();

        if (data.error) {
          setStatus('Error: ' + data.error, true);
          return;
        }

        const results = data.results || [];
        if (results.length === 0) {
          setStatus(`No results for "${q}"`);
          document.getElementById('results').innerHTML =
            '<div class="placeholder">No images matched that description.</div>';
          return;
        }

        setStatus(`${results.length} results for "${q}"`);
        document.getElementById('results').innerHTML = results.map(buildCard).join('');

        // Fade images in once loaded
        document.querySelectorAll('.card-img-wrap img').forEach(img => {
          img.classList.add('loading');
          img.onload  = () => img.classList.replace('loading', 'loaded');
          img.onerror = () => { img.classList.replace('loading', 'loaded'); img.alt = ''; };
        });

      } catch (e) {
        setStatus('Search failed: ' + e.message, true);
      }
    }

    function buildCard(item) {
      const fn    = item.filename || '';
      const score = item.score || 0;
      const tags  = (item.tags || []).slice(0, 5).join(', ');
      const matte = (item.matte && item.matte !== 'none') ? item.matte : '';
      const tvId  = document.getElementById('tv-selector').value;

      const imgSrc = `/local/frame_art/library/${encodeURIComponent(fn)}`;
      const pct    = Math.round(score * 100);
      const scCls  = scoreClass(score);

      return `
        <div class="card">
          <div class="card-img-wrap">
            <img src="${escAttr(imgSrc)}" alt="${escAttr(fn)}">
            <span class="score-badge ${scCls}">${pct}%</span>
          </div>
          <div class="card-body">
            <div class="card-name">
              <strong>${escHtml(stemName(fn))}</strong><br>${escHtml(fn)}
            </div>
            ${tags ? `<div class="card-tags">${escHtml(tags)}${matte ? ' · ' + escHtml(matte) : ''}</div>` : ''}
            <div class="card-footer">
              <button class="display-btn"
                      onclick="displayImage(this, ${JSON.stringify(fn)})">
                Display
              </button>
            </div>
          </div>
        </div>`;
    }

    // ── Display ──────────────────────────────────────────────────

    async function displayImage(btn, filename) {
      const tvId = document.getElementById('tv-selector').value;
      if (!tvId) {
        showToast('Select a TV first', 'error');
        return;
      }

      btn.classList.add('sending');
      btn.disabled = true;

      try {
        const r = await fetch(`${API}/display`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tv_id: tvId, filename }),
        });

        if (r.ok) {
          btn.textContent = '✓ Sent';
          btn.classList.replace('sending', 'sent');
          showToast(`Displaying ${stemName(filename)}`, 'success');
          setTimeout(() => {
            btn.textContent = 'Display';
            btn.classList.remove('sent');
            btn.disabled = false;
          }, 2500);
        } else {
          const err = await r.text();
          showToast('Error: ' + err, 'error');
          btn.classList.remove('sending');
          btn.disabled = false;
        }
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
        btn.classList.remove('sending');
        btn.disabled = false;
      }
    }

    // ── XSS helpers ──────────────────────────────────────────────

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function escAttr(s) { return escHtml(s); }

    // ── Init ─────────────────────────────────────────────────────

    document.getElementById('q').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    loadTVs();
  </script>
</body>
</html>

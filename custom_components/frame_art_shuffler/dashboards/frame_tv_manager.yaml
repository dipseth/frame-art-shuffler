title: Frame TV Manager
views:
- title: Frame
  path: 43e780795d314485ad18fb1ec5701a7b
  panel: true
  cards:
  - type: vertical-stack
    cards:
    - type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: 1fr 1fr 1fr
        grid-gap: 16px
        mediaquery:
          '(max-width: 800px)':
            grid-template-columns: 1fr
      cards:
      - type: vertical-stack
        cards:
        - type: vertical-stack
          cards:
          - type: markdown
            title: Artwork
            content: '{% if is_state(''binary_sensor.livingroom_frame_screen_on'',
              ''on'') %}

              ![Current Art](/local/frame_art/library/{{ states(''sensor.livingroom_frame_current_artwork'')
              }})

              {% else %}

              ![Current Art](/local/frame_art/library/{{ states(''sensor.livingroom_frame_current_artwork'')
              }})


              <center>***** Screen is off *****</center>

              {% endif %}


              **Matte:** {{ states(''sensor.livingroom_frame_current_matte'') or ''none''
              }}'
          - type: entities
            entities:
            - entity: switch.livingroom_frame_auto_shuffle_enable
              name: Auto Shuffle
            - entity: button.livingroom_frame_auto_shuffle_now
              name: Shuffle Image
            - entity: number.livingroom_frame_shuffle_frequency
              name: Shuffle Frequency
            - entity: sensor.livingroom_frame_auto_shuffle_next
              name: Next Auto Shuffle
            - entity: sensor.livingroom_frame_last_shuffle_timestamp
              name: Last Shuffle
            - entity: sensor.livingroom_frame_shuffled_matching_images
              name: Matching Images
      - type: vertical-stack
        cards:
        - type: entities
          title: Power Controls
          entities:
          - entity: switch.livingroom_frame_power
            name: Power
          - entity: button.livingroom_frame_art_mode
            name: Art Mode
          - entity: button.livingroom_frame_on_art_mode_12s
            name: On + Art Mode
          - entity: number.livingroom_frame_brightness
            name: Brightness Level
          - entity: sensor.livingroom_frame_current_artwork
            name: Current Image
          - entity: sensor.livingroom_frame_matte_filter
            name: Matte / Filter
          - entity: sensor.livingroom_frame_selected_tagset
            name: Selected Tagset
          - entity: sensor.livingroom_frame_override_tagset
            name: Override Tagset
          - entity: sensor.livingroom_frame_override_expiry
            name: Override Expiry
          - entity: sensor.livingroom_frame_tags
            name: Tags
        - type: entities
          title: Motion
          entities:
          - entity: switch.livingroom_frame_auto_motion_enable
            name: Auto-Motion Enable
          - entity: switch.livingroom_frame_verbose_motion_logging
            name: Verbose Logging
          - entity: button.livingroom_frame_auto_motion_off_now
          - entity: number.livingroom_frame_auto_motion_off_delay
            name: Off Delay
          - entity: sensor.livingroom_frame_auto_motion_off_at
            name: Turning Off At
          - entity: sensor.livingroom_frame_auto_motion_last_motion
            name: Last Motion
        - type: entities
          title: Brightness
          entities:
          - entity: switch.livingroom_frame_auto_bright_enable
            name: Auto-Brightness
          - entity: button.livingroom_frame_auto_bright_trigger_now
          - entity: sensor.livingroom_frame_auto_bright_sensor_lux
            name: Current Lux
          - entity: sensor.livingroom_frame_auto_bright_target
            name: Target Brightness
          - entity: sensor.livingroom_frame_auto_bright_next_adjust
            name: Next Adjustment
          - entity: sensor.livingroom_frame_auto_bright_last_adjust
            name: Last Adjustment
          - entity: number.livingroom_frame_auto_bright_min_lux
            name: Min Lux (Dark)
          - entity: number.livingroom_frame_auto_bright_max_lux
            name: Max Lux (Bright)
          - entity: number.livingroom_frame_auto_bright_min_level
            name: Min Level
          - entity: number.livingroom_frame_auto_bright_max_level
            name: Max Level
          - entity: button.livingroom_frame_auto_bright_calibrate_dark
          - entity: button.livingroom_frame_auto_bright_calibrate_bright
      - type: vertical-stack
        cards:
        - type: markdown
          content: '## Recent Activity


            {% set history = state_attr(''sensor.livingroom_frame_recent_activity'',
            ''formatted_history'') or [] %}

            {% if history | length == 0 %}

            _No activity recorded yet_

            {% else %}

            {% set ns = namespace(last_day=None) %}

            {% for event in history %}

            {% if event.day_header != ns.last_day %}

            **{{ event.day_header }}**

            {% set ns.last_day = event.day_header %}

            {% endif %}

            {{ event.time_display }} - {{ event.message }}

            {% endfor %}

            {% endif %}'
- title: Settings
  path: settings
  icon: mdi:cog
  cards:
  - type: vertical-stack
    cards:
    - type: markdown
      content: '## Display Logging


        **Status:** ✅ Enabled

        **Retention:** 6 months

        **Flush Interval:** 5 minutes


        ---


        To change these settings, go to:

        **Settings → Devices & Services → Frame Art Shuffler → Configure → Logging
        settings**

        '
    - type: markdown
      content: '## Activity Summary


        {% set summary_sensor = ''sensor.frame_art_log_summary'' %}

        {% if states(summary_sensor) == ''unknown'' or states(summary_sensor) == ''unavailable''
        %}

        _No activity data yet. Summary will appear after the first flush cycle._

        {% else %}

        {% set totals = state_attr(summary_sensor, ''totals'') or {} %}

        {% set generated = state_attr(summary_sensor, ''generated_at'') or ''Never''
        %}

        **Total Tracked Time:** {{ (totals.get(''tracked_seconds'', 0) / 3600) | round(1)
        }} hours

        **Total Events:** {{ totals.get(''event_count'', 0) }}

        **Last Updated:** {{ generated }}


        ---


        ### By TV

        {% set tvs = state_attr(summary_sensor, ''tvs'') or {} %}

        {% if tvs %}

        {% for tv_id, tv_data in tvs.items() %}

        - **{{ tv_data.get(''name'', tv_id) }}**: {{ (tv_data.get(''total_display_seconds'',
        0) / 3600) | round(1) }}h ({{ tv_data.get(''share_of_tracked'', 0) }}%)

        {% endfor %}

        {% else %}

        _No TV data yet_

        {% endif %}


        ---


        ### Top Tags

        {% set tags = state_attr(summary_sensor, ''tags'') or {} %}

        {% if tags %}

        {% for tag, tag_data in (tags.items() | list)[:10] %}

        - **{{ tag }}**: {{ (tag_data.get(''total_display_seconds'', 0) / 3600) |
        round(1) }}h

        {% endfor %}

        {% else %}

        _No tag data yet_

        {% endif %}

        {% endif %}

        '
    - type: button
      name: Clear All Frame Art Shuffler Logs
      icon: mdi:delete-forever
      icon_height: 40px
      tap_action:
        action: call-service
        service: frame_art_shuffler.clear_display_log
        confirmation:
          text: Are you sure you want to permanently delete all display log data?
            This cannot be undone.
